[package]
name = "bushwhacker"
version = "0.1.0"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond <spond@temple.edu>"]
description = "BUSHWHACKER: Bipartition Unification, Shunt Hunting, & Weighted Hub Aggregation via Combinadic Kolmogorov Entropy Reduction"
license = "MIT"
repository = "https://github.com/veg/bushwhacker"

[lib]
name = "bushwhacker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bushwhacker"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
